name: Invoke a Trace on Usetrace on push to development branch
on:
  push:
    branches:
      - development

jobs:
  test-usetrace-action:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run Usetrace Trace and Wait for it to finish
      id: executeTrace
      uses: usetrace/github-action@v2
      with:
        # Required parameters
        trigger-type: trace # Options: 'trace' or 'project')"
        trigger-id: aJEgVLmyrwAXs11X2AbjZgZkt0wdfJ5G # Id of a Trace or a Project
        wait-for-result: true
        usetrace-api-key: not-real-apikey
        
    - name: Check Trace execution result
      env:
        RESULT_REPORT: $
      run: |
        echo "REPORT: $RESULT_REPORT"
